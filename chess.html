<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>4MS3 | Chess</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            padding: 20px;

            background:

                radial-gradient(
                    circle at 15% 50%,
                    rgba(0, 120, 255, .14),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 50%,
                    rgba(255, 20, 140, .13),
                    transparent 35%
                ),

                #02030a;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;

            overflow-y: auto;

        }


        /* =========================================
           MAIN LAYOUT
        ========================================= */

        .chess-page {

            width: 100%;

            max-width: 1220px;

            min-height:
                calc(100vh - 40px);

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                640px
                300px;

            gap: 30px;

            align-items: center;

            justify-content: center;

        }


        /* =========================================
           BOARD
        ========================================= */

        .board-wrapper {

            position: relative;

            width: 640px;

            height: 640px;

            flex-shrink: 0;

        }


        .chess-board {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            background-image:
                url(
                    "4ms3_chess_assets/4ms3-chess-board.png"
                );

            background-size:
                100% 100%;

            background-position:
                center;

            background-repeat:
                no-repeat;

            transition:
                transform .35s ease;

        }


        /* =========================================
           RED PLAYER ORIENTATION
        ========================================= */

        .chess-board.flipped {

            transform:
                rotate(180deg);

        }


        /* =========================================
           GRID
        ========================================= */

        .board-grid {

            position: absolute;

            left: 7.5%;

            top: 11.2%;

            width: 81.4%;

            height: 75.4%;

            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            grid-template-rows:
                repeat(8, 1fr);

        }


        /* =========================================
           SQUARES
        ========================================= */

        .square {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            isolation: isolate;

        }


        .square:hover {

            background:
                rgba(255,255,255,.035);

        }


        /* =========================================
           SELECTED SQUARE
        ========================================= */

        .square.selected {

            box-shadow:

                inset 0 0 0 3px
                rgba(255,255,255,.9),

                inset 0 0 25px
                rgba(255,255,255,.18);

        }


        /* =========================================
           LEGAL MOVES
        ========================================= */

        .square.legal::after {

            content: "";

            width: 17%;

            aspect-ratio: 1;

            border-radius: 50%;

            background:
                rgba(255,255,255,.45);

            box-shadow:
                0 0 14px
                rgba(255,255,255,.40);

        }


        .square.capture::after {

            content: "";

            position: absolute;

            inset: 8%;

            border:
                2px solid
                rgba(255,255,255,.65);

            border-radius: 50%;

            box-shadow:
                0 0 15px
                rgba(255,255,255,.25);

        }


        /* =========================================
           LAST MOVE GLOW
        ========================================= */

        .square.last-move {

            background:
                rgba(120,70,255,.13);

            animation:
                lastMoveGlow
                1.15s
                ease-out
                both;

        }


        @keyframes lastMoveGlow {

            0% {

                box-shadow:

                    inset 0 0 0
                    rgba(120,80,255,0),

                    0 0 0
                    rgba(120,80,255,0);

                background:
                    rgba(120,70,255,.05);

            }


            25% {

                box-shadow:

                    inset 0 0 20px
                    rgba(100,130,255,.22),

                    0 0 25px
                    rgba(130,70,255,.38);

                background:
                    rgba(120,80,255,.25);

            }


            60% {

                box-shadow:

                    inset 0 0 12px
                    rgba(100,130,255,.12),

                    0 0 14px
                    rgba(130,70,255,.22);

                background:
                    rgba(120,80,255,.15);

            }


            100% {

                box-shadow:

                    inset 0 0 5px
                    rgba(100,100,255,.06),

                    0 0 0
                    rgba(120,80,255,0);

                background:
                    rgba(120,70,255,.09);

            }

        }


        /* =========================================
           CHECK ANIMATION
        ========================================= */

        .square.check-square {

            z-index: 5;

            animation:
                kingCheckPulse
                .7s
                ease-in-out
                infinite;

        }


        .square.check-square::before {

            content: "";

            position: absolute;

            inset: 7%;

            border-radius: 18%;

            border:
                2px solid
                rgba(255,65,110,.95);

            box-shadow:

                inset 0 0 16px
                rgba(255,40,90,.65),

                0 0 14px
                rgba(255,40,90,.70),

                0 0 30px
                rgba(255,40,90,.35);

            pointer-events:
                none;

            z-index: 1;

        }


        @keyframes kingCheckPulse {

            0% {

                filter:
                    brightness(1);

            }


            50% {

                filter:
                    brightness(1.18);

            }


            100% {

                filter:
                    brightness(1);

            }

        }


        /* =========================================
           CAPTURE IMPACT
        ========================================= */

        .square.capture-impact {

            animation:
                captureSquareFlash
                .34s
                ease-out
                both;

        }


        .square.capture-impact::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 18%;

            aspect-ratio: 1;

            border-radius: 50%;

            border:
                3px solid
                rgba(255,255,255,.95);

            transform:
                translate(-50%, -50%)
                scale(.15);

            opacity: 0;

            z-index: 9;

            pointer-events:
                none;

            animation:
                captureShockwave
                .42s
                cubic-bezier(
                    .16,
                    .85,
                    .25,
                    1
                )
                both;

        }


        .square.capture-impact::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 50%;

            width: 25%;

            aspect-ratio: 1;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,70,190,.85);

            transform:
                translate(-50%, -50%)
                scale(.1);

            opacity: 0;

            z-index: 8;

            pointer-events:
                none;

            animation:
                captureShockwaveOuter
                .48s
                cubic-bezier(
                    .16,
                    .85,
                    .25,
                    1
                )
                both;

        }


        @keyframes captureShockwave {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(.15);

                opacity: 0;

            }


            18% {

                transform:
                    translate(-50%, -50%)
                    scale(.75);

                opacity: 1;

                box-shadow:

                    0 0 12px
                    rgba(255,255,255,.85),

                    0 0 28px
                    rgba(90,160,255,.65);

            }


            55% {

                transform:
                    translate(-50%, -50%)
                    scale(1.8);

                opacity: .8;

            }


            100% {

                transform:
                    translate(-50%, -50%)
                    scale(2.8);

                opacity: 0;

            }

        }


        @keyframes captureShockwaveOuter {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(.1);

                opacity: 0;

            }


            25% {

                transform:
                    translate(-50%, -50%)
                    scale(.9);

                opacity: .85;

            }


            65% {

                transform:
                    translate(-50%, -50%)
                    scale(2.4);

                opacity: .45;

            }


            100% {

                transform:
                    translate(-50%, -50%)
                    scale(3.4);

                opacity: 0;

            }

        }


        @keyframes captureSquareFlash {

            0% {

                box-shadow:

                    inset 0 0 0
                    rgba(255,255,255,0),

                    0 0 0
                    rgba(255,255,255,0);

            }


            25% {

                box-shadow:

                    inset 0 0 24px
                    rgba(255,255,255,.25),

                    0 0 22px
                    rgba(140,70,255,.55);

            }


            100% {

                box-shadow:

                    inset 0 0 0
                    rgba(255,255,255,0),

                    0 0 0
                    rgba(255,255,255,0);

            }

        }


        /* =========================================
           PIECE MOTION
        ========================================= */

        .piece-motion {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 2;

        }


        .piece-motion.piece-moving {

            animation:
                chessPieceGlide
                .34s
                cubic-bezier(
                    .22,
                    .75,
                    .25,
                    1
                )
                both;

        }


        @keyframes chessPieceGlide {

            0% {

                transform:
                    translate3d(
                        var(--move-x),
                        var(--move-y),
                        0
                    )
                    scale(.97);

            }


            65% {

                transform:
                    translate3d(
                        calc(
                            var(--move-x) * .08
                        ),
                        calc(
                            var(--move-y) * .08
                        ),
                        0
                    )
                    scale(1.01);

            }


            100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

        }


        /* =========================================
           RED MOVEMENT
        ========================================= */

        .chess-board.flipped
        .piece-motion.piece-moving {

            animation-name:
                chessPieceGlideFlipped;

        }


        @keyframes chessPieceGlideFlipped {

            0% {

                transform:
                    translate3d(
                        calc(
                            var(--move-x) * -1
                        ),
                        calc(
                            var(--move-y) * -1
                        ),
                        0
                    )
                    scale(.97);

            }


            65% {

                transform:
                    translate3d(
                        calc(
                            var(--move-x) * -.08
                        ),
                        calc(
                            var(--move-y) * -.08
                        ),
                        0
                    )
                    scale(1.01);

            }


            100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

        }


        /* =========================================
           PNG PIECES
        ========================================= */

        .piece {

            width: 86%;

            height: 86%;

            object-fit: contain;

            display: block;

            user-select: none;

            pointer-events: none;

        }


        /* =========================================
           SELECTED PIECE PULSE
        ========================================= */

        .square.selected
        .piece {

            animation:
                selectedPiecePulse
                1s
                ease-in-out
                infinite;

        }


        @keyframes selectedPiecePulse {

            0% {

                transform:
                    scale(1);

                filter:
                    drop-shadow(
                        0 0 0
                        rgba(255,255,255,0)
                    )
                    drop-shadow(
                        0 0 0
                        rgba(40,160,255,0)
                    );

            }


            50% {

                transform:
                    scale(1.055);

                filter:

                    drop-shadow(
                        0 0 5px
                        rgba(255,255,255,.75)
                    )

                    drop-shadow(
                        0 0 14px
                        rgba(40,160,255,.90)
                    )

                    drop-shadow(
                        0 0 26px
                        rgba(80,100,255,.55)
                    );

            }


            100% {

                transform:
                    scale(1);

                filter:

                    drop-shadow(
                        0 0 0
                        rgba(255,255,255,0)
                    )

                    drop-shadow(
                        0 0 0
                        rgba(40,160,255,0)
                    );

            }

        }


        /* =========================================
           RED SELECTED PIECE
        ========================================= */

        .chess-board.flipped
        .square.selected
        .piece {

            animation:
                selectedPiecePulseFlipped
                1s
                ease-in-out
                infinite;

        }


        @keyframes selectedPiecePulseFlipped {

            0% {

                transform:
                    rotate(180deg)
                    scale(1);

                filter:
                    drop-shadow(
                        0 0 0
                        rgba(255,255,255,0)
                    )
                    drop-shadow(
                        0 0 0
                        rgba(255,60,150,0)
                    );

            }


            50% {

                transform:
                    rotate(180deg)
                    scale(1.055);

                filter:

                    drop-shadow(
                        0 0 5px
                        rgba(255,255,255,.75)
                    )

                    drop-shadow(
                        0 0 14px
                        rgba(255,70,180,.90)
                    )

                    drop-shadow(
                        0 0 26px
                        rgba(180,70,255,.55)
                    );

            }


            100% {

                transform:
                    rotate(180deg)
                    scale(1);

                filter:

                    drop-shadow(
                        0 0 0
                        rgba(255,255,255,0)
                    )

                    drop-shadow(
                        0 0 0
                        rgba(255,60,150,0)
                    );

            }

        }


        /* =========================================
           RED PIECES STAY UPRIGHT
        ========================================= */

        .chess-board.flipped
        .piece {

            transform:
                rotate(180deg);

        }


        /* =========================================
           GAME OVER OVERLAY
        ========================================= */

        .game-effect-overlay {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 50;

        }


        .game-effect-overlay.visible {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            animation:
                victoryOverlayIn
                .5s
                ease-out
                both;

        }


        .game-effect-overlay::before {

            content: "";

            position: absolute;

            inset: 8%;

            border-radius: 25px;

            background:

                radial-gradient(
                    circle,
                    rgba(120,80,255,.20),
                    transparent 68%
                );

            filter:
                blur(10px);

            animation:
                victoryPulse
                1.1s
                ease-in-out
                infinite;

        }


        /* =========================================
           GAME OVER BOX
        ========================================= */

        .game-effect-box {

            position: relative;

            padding:
                28px 42px;

            border:
                1px solid
                rgba(150,110,255,.55);

            border-radius:
                18px;

            background:

                linear-gradient(
                    145deg,
                    rgba(8,10,28,.92),
                    rgba(20,8,38,.92)
                );

            box-shadow:

                0 0 30px
                rgba(110,70,255,.35),

                inset 0 0 30px
                rgba(120,80,255,.08);

            text-align:
                center;

            backdrop-filter:
                blur(12px);

            animation:
                victoryBox
                .55s
                cubic-bezier(
                    .16,
                    .85,
                    .25,
                    1
                )
                both;

        }


        .game-effect-small {

            color:
                #a99bc8;

            font-size:
                8px;

            font-weight:
                900;

            letter-spacing:
                4px;

        }


        /* =========================================
           VICTORY TITLE
           KEEPING THE ORIGINAL COLOR
        ========================================= */

        .game-effect-title {

            margin-top:
                8px;

            font-size:
                28px;

            font-weight:
                1000;

            letter-spacing:
                -1px;

            background:

                linear-gradient(
                    90deg,
                    #1aa5ff,
                    #9147ff,
                    #ff3a9d
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            animation:
                victoryText
                1.2s
                ease-in-out
                infinite;

        }


        /* =========================================
           DEFEAT RED
        ========================================= */

        .game-effect-title.defeat {

            background:
                linear-gradient(
                    90deg,
                    #ff3030,
                    #ff4d4d,
                    #ff1515
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            text-shadow:
                0 0 18px
                rgba(255,40,40,.35);

        }


        .game-effect-overlay.defeat::before {

            background:

                radial-gradient(
                    circle,
                    rgba(255,30,50,.19),
                    transparent 68%
                );

        }


        .game-effect-overlay.defeat
        .game-effect-box {

            border-color:
                rgba(255,70,70,.45);

            box-shadow:

                0 0 30px
                rgba(255,30,50,.25),

                inset 0 0 30px
                rgba(255,40,40,.06);

        }


        /* =========================================
           STALEMATE / DRAW GRAY
        ========================================= */

        .game-effect-overlay.stalemate::before {

            background:

                radial-gradient(
                    circle,
                    rgba(160,170,185,.18),
                    transparent 68%
                );

            animation:
                stalematePulse
                1.4s
                ease-in-out
                infinite;

        }


        .game-effect-overlay.stalemate
        .game-effect-box {

            border-color:
                rgba(170,180,195,.38);

            background:

                linear-gradient(
                    145deg,
                    rgba(18,20,27,.94),
                    rgba(25,27,35,.94)
                );

            box-shadow:

                0 0 28px
                rgba(150,160,175,.18),

                inset 0 0 30px
                rgba(180,190,200,.05);

        }


        .game-effect-overlay.stalemate
        .game-effect-small {

            color:
                #9da5b0;

        }


        .game-effect-overlay.stalemate
        .game-effect-title {

            background:

                linear-gradient(
                    90deg,
                    #c5c9cf,
                    #9299a4,
                    #d9dde2
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            text-shadow:
                0 0 18px
                rgba(190,195,205,.22);

            animation:
                stalemateText
                1.6s
                ease-in-out
                infinite;

        }


        @keyframes stalematePulse {

            0%,
            100% {

                opacity:
                    .45;

                transform:
                    scale(.96);

            }


            50% {

                opacity:
                    .85;

                transform:
                    scale(1.04);

            }

        }


        @keyframes stalemateText {

            0%,
            100% {

                filter:
                    brightness(1);

            }


            50% {

                filter:
                    brightness(1.22);

            }

        }


        @keyframes victoryOverlayIn {

            0% {

                opacity:
                    0;

            }


            100% {

                opacity:
                    1;

            }

        }


        @keyframes victoryBox {

            0% {

                transform:
                    translateY(18px)
                    scale(.86);

                opacity:
                    0;

            }


            100% {

                transform:
                    translateY(0)
                    scale(1);

                opacity:
                    1;

            }

        }


        @keyframes victoryText {

            0%,
            100% {

                filter:
                    brightness(1);

            }


            50% {

                filter:
                    brightness(1.35);

            }

        }


        @keyframes victoryPulse {

            0%,
            100% {

                opacity:
                    .45;

                transform:
                    scale(.94);

            }


            50% {

                opacity:
                    .9;

                transform:
                    scale(1.04);

            }

        }


        /* =========================================
           REMATCH REQUEST
        ========================================= */

        .rematch-request-box {
            position: relative;
            z-index: 10;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid rgba(190,120,255,.30);
            border-radius: 10px;
            background: rgba(80,40,120,.14);
        }

        .rematch-request-text {
            color: #d8cbed;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1.5;
        }

        .rematch-response-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .accept-rematch-button {
            background: linear-gradient(90deg,#168fe0,#7040dc);
        }

        .refuse-rematch-button {
            background: linear-gradient(90deg,#7a2028,#d33545);
        }

        /* =========================================
           SIDE PANEL
        ========================================= */

        .chess-panel {

            width: 300px;

            padding: 25px;

            border:
                1px solid
                rgba(90,160,255,.20);

            border-radius: 18px;

            background:

                linear-gradient(
                    145deg,
                    rgba(10,15,35,.92),
                    rgba(4,6,18,.95)
                );

            box-shadow:

                0 20px 60px
                rgba(0,0,0,.35),

                inset 0 0 30px
                rgba(80,50,255,.03);

            backdrop-filter:
                blur(15px);

        }


        .chess-label {

            color:
                #62bfff;

            font-size:
                8px;

            font-weight:
                900;

            letter-spacing:
                3px;

        }


        .chess-title {

            margin-top:
                10px;

            font-size:
                40px;

            font-weight:
                1000;

            letter-spacing:
                -2px;

        }


        .chess-title span {

            background:

                linear-gradient(
                    90deg,
                    #168fe0,
                    #8b42ff,
                    #ff278e
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        /* =========================================
           PLAYER
        ========================================= */

        .player-card {

            margin-top:
                20px;

            padding:
                15px;

            border:
                1px solid
                rgba(90,150,255,.15);

            border-radius:
                10px;

            background:
                rgba(5,8,20,.72);

        }


        .player-label {

            color:
                #65728e;

            font-size:
                8px;

            letter-spacing:
                2px;

        }


        .player-name {

            margin-top:
                7px;

            color:
                white;

            font-size:
                14px;

            font-weight:
                900;

        }


        /* =========================================
           ONLINE MATCHMAKING
        ========================================= */

        .online-card {

            margin-top:
                20px;

            padding:
                15px;

            border:
                1px solid
                rgba(90,150,255,.15);

            border-radius:
                10px;

            background:
                rgba(5,8,20,.72);

        }


        .online-label {

            color:
                #65728e;

            font-size:
                8px;

            letter-spacing:
                2px;

            font-weight:
                900;

        }


        .online-status {

            margin-top:
                9px;

            color:
                #9aa9c7;

            font-size:
                10px;

            line-height:
                1.6;

        }


        .queue-count {

            margin-top:
                8px;

            color:
                #5ebfff;

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                1px;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .chess-button {

playerNameElement.textContent =

let currentMatch =

null;

function getMoveKey(move) {

    if (
        !move ||
        !move.from ||
        !move.to
    ) {

        return null;

    }


    return (

        move.from +
        "-" +
        move.to +
        "-" +
        (
            move.promotion ||
            ""
        )

    );

}


function updateBoardOrientation() {

    if (

        currentMatch &&
        currentMatch.color ===

        );

        );

/* =========================================
   GAME EFFECTS
========================================= */

function showVictory() {

    gameEffectOverlay.classList.remove(
        "defeat",
        "stalemate"
    );


    gameEffectSmall.textContent =
        "GAME OVER";


    gameEffectTitle.textContent =
        "VICTORY";


    gameEffectTitle.className =
        "game-effect-title";


    gameEffectOverlay.classList.add(
        "visible"
    );

}

/* =========================================
   SHOW TIMEOUT RESULT
========================================= */

function showChessTimeout(
    timedOutPlayer
) {

    if (
        !gameEffectOverlay ||
        !gameEffectTitle ||
        !gameEffectSmall
    ) {

        return;

    }


    const iTimedOut =
        String(
            timedOutPlayer || ""
        )
        .trim()
        .toLowerCase() ===
        String(
            playerName || ""
        )
        .trim()
        .toLowerCase();


    gameEffectOverlay.classList.remove(
        "defeat",
        "stalemate",
        "timeout"
    );


    gameEffectOverlay.classList.add(
        "timeout"
    );


    gameEffectSmall.textContent =
        "TIME'S UP";


    gameEffectTitle.textContent =
        iTimedOut
            ? "DEFEAT"
            : "VICTORY";


    if (
        gameOverButtons
    ) {

        gameOverButtons.style.display =
            "flex";

    }


    gameEffectOverlay.classList.add(
        "visible"
    );

}


function showDefeat() {

    gameEffectOverlay.classList.remove(
        "stalemate"
    );


    gameEffectSmall.textContent =
        "GAME OVER";


    gameEffectTitle.textContent =
        "DEFEAT";


    gameEffectTitle.className =
        "game-effect-title defeat";


    gameEffectOverlay.classList.add(
        "visible",
        "defeat"
    );

}


function showStalemate() {

    gameEffectOverlay.classList.remove(
        "defeat"
    );


    gameEffectSmall.textContent =
        "DRAW";


    gameEffectTitle.textContent =
        "STALEMATE";


    gameEffectTitle.className =
        "game-effect-title";


    gameEffectOverlay.classList.add(
        "visible",
        "stalemate"
    );

}


function hideGameEffect() {

    gameEffectOverlay.classList.remove(
        "visible",
        "defeat",
        "stalemate"
    );

}


function updateGameEffectState() {

    /*
     * Stalemate first because it is
     * a draw and should never show
     * victory/defeat.
     */

    if (
        game.isStalemate()
    ) {

        showStalemate();

        return;

    }


    if (
        game.isCheckmate()
    ) {

        if (
            onlineGameActive &&
            currentMatch
        ) {

            const loserColor =
                game.turn() === "w"
                    ? "white"
                    : "black";


            if (
                loserColor ===
                currentMatch.color
            ) {

                showDefeat();

            } else {

                showVictory();

            }

        } else {

            showVictory();

        }


        return;

    }


    if (
        onlineGameActive &&
        currentMatch &&
        currentMatch.resignedBy
    ) {

        const resignedByMe =
            currentMatch.resignedBy
                .toLowerCase() ===
            playerName.toLowerCase();


        if (
            resignedByMe
        ) {

            showDefeat();

        } else {

            showVictory();

        }


        return;

    }


    hideGameEffect();

}


function applyServerPosition(
    fen,
    animateMove = null
) {

    try {

        game.load(
            fen
        );


        serverFen =
            fen;


        selectedSquare =
            null;


        pendingMoveAnimation =
            animateMove;


        renderBoard();


    } catch (error) {

        console.error(
            "Couldn't apply server position:",
            error
        );

    }

}


function renderBoard() {

    boardGrid.innerHTML =
        "";


    const board =
        game.board();


    const lastMove =
        currentMatch &&
        currentMatch.lastMove
            ? currentMatch.lastMove
            : null;


    const animateMove =
        pendingMoveAnimation;


    pendingMoveAnimation =
        null;


    let checkKingSquare =
        null;


    if (
        game.inCheck()
    ) {

        const sideInCheck =
            game.turn();


        for (
            let rowIndex = 0;
            rowIndex < 8;
            rowIndex++
        ) {

            for (
                let columnIndex = 0;
                columnIndex < 8;
                columnIndex++
            ) {

                const piece =
                    board[
                        rowIndex
                    ][
                        columnIndex
                    ];


                if (
                    piece &&
                    piece.type === "k" &&
                    piece.color === sideInCheck
                ) {

                    const file =
                        String.fromCharCode(
                            97 +
                            columnIndex
                        );


                    const rank =
                        8 -
                        rowIndex;


                    checkKingSquare =
                        file +
                        rank;

                }

            }

        }

    }


    board.forEach(
        (row, rowIndex) => {

            row.forEach(
                (piece, columnIndex) => {

                    const square =
                        document.createElement(
                            "div"
                        );


                    square.className =
                        "square";


                    const file =
                        String.fromCharCode(
                            97 +
                            columnIndex
                        );


                    const rank =
                        8 -
                        rowIndex;


                    const squareName =
                        file +
                        rank;


                    square.dataset.square =
                        squareName;


                    if (
                        selectedSquare ===
                        squareName
                    ) {

                        square.classList.add(
                            "selected"
                        );

                    }


                    if (
                        lastMove &&
                        (
                            lastMove.from ===
                            squareName ||

                            lastMove.to ===
                            squareName
                        )
                    ) {

                        square.classList.add(
                            "last-move"
                        );

                    }


                    if (
                        checkKingSquare ===
                        squareName
                    ) {

                        square.classList.add(
                            "check-square"
                        );

                    }


                    if (
                        animateMove &&
                        animateMove.to ===
                        squareName &&
                        animateMove.isCapture
                    ) {

                        square.classList.add(
                            "capture-impact"
                        );

                    }


                    if (
                        selectedSquare
                    ) {

                        highlightMoves(
                            square,
                            squareName
                        );

                    }


                    if (
                        piece
                    ) {

                        const motionWrapper =
                            document.createElement(
                                "div"
                            );


                        motionWrapper.className =
                            "piece-motion";


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.className =
                            "piece";


                        image.src =
                            pieceImages[
                                piece.color
                            ][
                                piece.type
                            ];


                        image.alt =
                            `${piece.color}${piece.type}`;


                        image.draggable =
                            false;


                        motionWrapper.appendChild(
                            image
                        );


                        square.appendChild(
                            motionWrapper
                        );

                    }


                    square.addEventListener(
                        "click",
                        () => {

                            handleSquareClick(
                                squareName
                            );

                        }
                    );


                    boardGrid.appendChild(
                        square
                    );

                }
            );

        }
    );


    if (
        animateMove &&
        animateMove.from &&
        animateMove.to
    ) {

        requestAnimationFrame(
            () => {

                animatePieceMove(
                    animateMove.from,
                    animateMove.to
                );

            }
        );

    }


    updateBoardStatus();

    updateGameEffectState();

}


function animatePieceMove(
    fromSquare,
    toSquare
) {

    const fromElement =
        boardGrid.querySelector(
            `[data-square="${fromSquare}"]`
        );

    const toElement =
        boardGrid.querySelector(
            `[data-square="${toSquare}"]`
        );

    if (!fromElement || !toElement) {
        return;
    }

    const pieceWrapper =
        toElement.querySelector(
            ".piece-motion"
        );

    if (!pieceWrapper) {
        return;
    }

    const fromRect =
        fromElement.getBoundingClientRect();

    const toRect =
        toElement.getBoundingClientRect();

    let moveX =
        (fromRect.left + fromRect.width / 2) -
        (toRect.left + toRect.width / 2);

    let moveY =
        (fromRect.top + fromRect.height / 2) -
        (toRect.top + toRect.height / 2);

    if (chessBoard.classList.contains("flipped")) {
        moveX *= -1;
        moveY *= -1;
    }

    pieceWrapper.animate(
        [
            {
                transform: `translate3d(${moveX}px, ${moveY}px, 0) scale(.97)`
            },
            {
                transform: `translate3d(${moveX * .08}px, ${moveY * .08}px, 0) scale(1.01)`,
                offset: .65
            },
            {
                transform: "translate3d(0,0,0) scale(1)"
            }
        ],
        {
            duration: 360,
            easing: "cubic-bezier(.22,.75,.25,1)",
            fill: "both"
        }
    );
}function highlightMoves(
    squareElement,
    squareName
) {

    if (
        !selectedSquare
    ) {

        return;

    }


    if (
        onlineGameActive &&
        currentMatch
    ) {

        const currentColor =
            game.turn() === "w"
                ? "white"
                : "black";


        if (
            currentColor !==
            currentMatch.color
        ) {

            return;

        }

    }


    const moves =
        game.moves({

            square:
                selectedSquare,

            verbose:
                true

        });


    const legalMove =
        moves.find(
            move =>
                move.to ===
                squareName
        );


    if (
        legalMove
    ) {

        squareElement.classList.add(

            legalMove.captured
                ? "capture"
                : "legal"

        );

    }

}

function handleLocalSquareClick(
    square
) {

    if (
        game.isGameOver()
    ) {

        return;

    }


    if (
        selectedSquare
    ) {

        const legalMoves =
            game.moves({

                square:
                    selectedSquare,

                verbose:
                    true

            });


        const move =
    legalMoves.find(
        item =>
            item.to === square &&
            (
                !item.promotion ||
                item.promotion === "q"
            )
    );


        if (
            move
        ) {

            game.move({

                from:
                    selectedSquare,

                to:
                    square,

                promotion:
                    "q"

            });


            selectedSquare =
                null;


            renderBoard();

            return;

        }

    }


    const piece =
        game.get(
            square
        );


    if (
        piece &&
        piece.color ===
        game.turn()
    ) {

        selectedSquare =
            square;

    } else {

        selectedSquare =
            null;

    }


    renderBoard();

}


async function handleOnlineSquareClick(
    square
) {

    if (
        !currentMatch ||
        moveInProgress
    ) {

        return;

    }


    if (
        currentMatch.isGameOver ||
        currentMatch.isCheckmate ||
        currentMatch.isDraw ||
        currentMatch.resignedBy
    ) {

        return;

    }


    const currentColor =
        game.turn() === "w"
            ? "white"
            : "black";


    if (
        currentColor !==
        currentMatch.color
    ) {

        chessStatus.textContent =
            "WAIT FOR YOUR OPPONENT.";

        return;

    }


    if (
        selectedSquare
    ) {

        const legalMoves =
            game.moves({

                square:
                    selectedSquare,

                verbose:
                    true

            });


        const move =
    legalMoves.find(
        item =>
            item.to === square &&
            (
                !item.promotion ||
                item.promotion === "q"
            )
    );


        if (
            move
        ) {

            await sendOnlineMove(

                selectedSquare,

                square,

                move.promotion ||
                "q"

            );

            return;

        }

    }


    const piece =
        game.get(
            square
        );


    if (
        piece &&
        piece.color ===
        game.turn()
    ) {

        selectedSquare =
            square;

    } else {

        selectedSquare =
            null;

    }


    renderBoard();

}


async function sendOnlineMove(
    from,
    to,
    promotion
) {

    if (
        !currentMatch ||
        moveInProgress
    ) {

        return;

    }


    const capturedPiece =
        game.get(
            to
        );


    const isCapture =
        Boolean(
            capturedPiece
        );


    moveInProgress =
        true;


    chessStatus.textContent =
        "⚡ SENDING MOVE...";


    try {

        const response =
            await fetch(

                "/api/chess/match/" +
                encodeURIComponent(
                    currentMatch.matchId
                ) +
                "/move",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name:
                                playerName,

                            from:
                                from,

                            to:
                                to,

                            promotion:
                                promotion ||
                                "q"

                        })

                }

            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            chessStatus.textContent =
                "⚠ " +
                (
                    result.message ||
                    "MOVE REJECTED."
                );


            selectedSquare =
                null;


            renderBoard();

            return;

        }


        currentMatch =
            result;


        lastAnimatedMoveKey =
            getMoveKey(
                result.lastMove
            );


        applyServerPosition(

            result.fen,

            {

                ...result.lastMove,

                isCapture:
                    isCapture

            }

        );


        updateBoardStatus();


    } catch (error) {

        console.error(
            "Online move error:",
            error
        );


        chessStatus.textContent =
            "❌ COULDN'T SEND MOVE.";

    }


    moveInProgress =
        false;

}

updateBoardStatus();

if (

else {

let clockDisplayTimer =
    null;


function formatChessTime(
    milliseconds
) {

    const totalSeconds =
        Math.max(
            0,
            Math.ceil(
                milliseconds / 1000
            )
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    return (
        String(minutes)
            .padStart(2, "0")
        +
        ":" +
        String(seconds)
            .padStart(2, "0")
    );

}


function renderChessClock(
    element,
    milliseconds
) {

    if (!element) {
        return;
    }


    element.textContent =
        formatChessTime(
            milliseconds
        );


    element.classList.remove(
        "warning",
        "danger"
    );


    if (
        milliseconds <=
        10 * 1000
    ) {

        element.classList.add(
            "danger"
        );

    }

    else if (
        milliseconds <=
        60 * 1000
    ) {

        element.classList.add(
            "warning"
        );

    }

}


function updateChessClocks() {

    if (
        !currentMatch ||
        !onlineGameActive
    ) {
        return;
    }


    /*
     * IMPORTANT:
     * The server already sends the current
     * remaining time. Do NOT subtract
     * turnStartedAt again here.
     */

    const whiteTime =
        Math.max(
            0,
            Number(
                currentMatch.whiteTimeMs
            ) || 0
        );


    const blackTime =
        Math.max(
            0,
            Number(
                currentMatch.blackTimeMs
            ) || 0
        );


    const myTime =
        currentMatch.color === "white"
            ? whiteTime
            : blackTime;


    const opponentTime =
        currentMatch.color === "white"
            ? blackTime
            : whiteTime;


    renderChessClock(
        playerClock,
        myTime
    );


    renderChessClock(
        opponentClock,
        opponentTime
    );

}

function updateBoardStatus() {

    if (
        onlineGameActive &&
        currentMatch
    ) {

        const myColor =
            currentMatch.color;


        const turnColor =
            game.turn() === "w"
                ? "white"
                : "black";


        const myTurn =
            myColor ===
            turnColor;


        if (
            currentMatch.resignedBy
        ) {

            const resignedByMe =
                currentMatch.resignedBy
                    .toLowerCase() ===
                playerName.toLowerCase();


            turnIndicator.textContent =
                resignedByMe
                    ? "YOU RESIGNED"
                    : "OPPONENT RESIGNED";


            chessStatus.textContent =
                resignedByMe
                    ? "GAME OVER."
                    : "YOU WIN — OPPONENT RESIGNED.";

            return;

        }


        if (
            currentMatch.isCheckmate
        ) {

            turnIndicator.textContent =
                "CHECKMATE";


            const loserColor =
                game.turn() === "w"
                    ? "white"
                    : "black";


            chessStatus.textContent =
                loserColor === myColor
                    ? "YOU LOST."
                    : "YOU WIN.";

            return;

        }


        if (
            currentMatch.isDraw ||
            game.isStalemate()
        ) {

            turnIndicator.textContent =
                "STALEMATE";


            chessStatus.textContent =
                "THE GAME ENDED IN A DRAW.";

            return;

        }


        if (
            currentMatch.isCheck
        ) {

            turnIndicator.textContent =
                myTurn
                    ? "⚠ YOUR KING IS IN CHECK"
                    : "⚠ OPPONENT IN CHECK";

        } else {

            turnIndicator.textContent =
                myTurn
                    ? "⚡ YOUR TURN"
                    : "WAITING FOR OPPONENT";

        }


        chessStatus.textContent =
            myTurn
                ? "MAKE YOUR MOVE."
                : `WAITING FOR ${currentMatch.opponent}.`;

        return;

    }


    const turn =
        game.turn() === "w"
            ? "BLUE"
            : "RED";


    turnIndicator.textContent =
        `LOCAL TEST — ${turn} TO MOVE`;


    if (
        game.isStalemate()
    ) {

        chessStatus.textContent =
            "STALEMATE";

    }

    else if (
        game.isCheckmate()
    ) {

        chessStatus.textContent =
            "♔ CHECKMATE";

    }

    else if (
        game.isStalemate()
    ) {

        chessStatus.textContent =
            "STALEMATE";

    }

    else if (
        game.isDraw()
    ) {

        chessStatus.textContent =
            "DRAW";

    }

    else if (
        game.inCheck()
    ) {

        chessStatus.textContent =
            "⚠ CHECK";

    }

    else {

        chessStatus.textContent =
            "LOCAL CHESS TEST.";

    }

}

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: playerName })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Couldn't request rematch.");
        }

        if (result.ready && result.rematchMatchId) {
            await startRematch(result.rematchMatchId);
            return;
        }

        startRematchPolling();

    } catch (error) {

        console.error("Rematch request error:", error);
        rematchStatus.textContent = "❌ COULDN'T REQUEST REMATCH.";
        rematchButton.disabled = false;
        playAgainButton.disabled = false;
    }
}


function startRematchPolling() {

    stopRematchPolling();
    checkRematchStatus();
    rematchPollingTimer = setInterval(checkRematchStatus, 1000);
}


function stopRematchPolling() {

    if (rematchPollingTimer) {
        clearInterval(rematchPollingTimer);
        rematchPollingTimer = null;
    }
}


async function checkRematchStatus() {

    if (!currentMatch) return;

    try {

        const response = await fetch(
            "/api/chess/match/" +
            encodeURIComponent(currentMatch.matchId) +
            "/rematch/status?name=" +
            encodeURIComponent(playerName)
        );

        if (!response.ok) return;

        const result = await response.json();

        if (result.ready && result.matchId) {
            stopRematchPolling();
            await startRematch(result.matchId);
            return;
        }

        if (result.refused) {
            rematchStatus.textContent = "⚠ OPPONENT REFUSED THE REMATCH.";
            rematchButton.disabled = false;
            playAgainButton.disabled = false;
            return;
        }

        if (result.incomingRequest) {
            rematchRequestBox.style.display = "block";
            rematchRequestText.textContent = `${result.requester} WANTS A REMATCH.`;
            rematchStatus.textContent = "CHOOSE ACCEPT OR REFUSE.";
            return;
        }

        if (result.requestedByMe) {
            rematchRequestBox.style.display = "none";
            rematchStatus.textContent = "WAITING FOR OPPONENT TO ACCEPT...";
            return;
        }

    } catch (error) {
        console.error("Rematch status error:", error);
    }
}


async function respondToRematch(action) {

    if (!currentMatch) return;

    acceptRematchButton.disabled = true;
    refuseRematchButton.disabled = true;

    try {

        const response = await fetch(
            "/api/chess/match/" +
            encodeURIComponent(currentMatch.matchId) +
            "/rematch/respond",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: playerName, action })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Couldn't process rematch response.");
        }

        if (action === "accept" && result.rematchMatchId) {
            await startRematch(result.rematchMatchId);
            return;
        }

        rematchRequestBox.style.display = "none";
        rematchStatus.textContent = "REMATCH REFUSED.";
        rematchButton.disabled = false;
        playAgainButton.disabled = false;

    } catch (error) {

        console.error("Rematch response error:", error);
        rematchStatus.textContent = "❌ COULDN'T PROCESS RESPONSE.";
        acceptRematchButton.disabled = false;
        refuseRematchButton.disabled = false;
    }
}


async function startRematch(matchId) {

    try {

        const response = await fetch(
            "/api/chess/match/" +
            encodeURIComponent(matchId) +
            "?name=" +
            encodeURIComponent(playerName)
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Couldn't load rematch.");
        }

        currentMatch = result;
        onlineGameActive = true;
        lastAnimatedMoveKey = null;

        stopRematchPolling();
        hideGameEffect();
        resetRematchUI();
        updateBoardOrientation();
        applyServerPosition(result.fen, null);

        enterMatchButton.disabled = true;
        resignButton.style.display = "block";
        onlineStatus.textContent = "♟ REMATCH STARTED";
        chessStatus.textContent = "NEW GAME — MAKE YOUR MOVE.";

        startGamePolling();
        updateBoardStatus();

    } catch (error) {

        console.error("Start rematch error:", error);
        rematchStatus.textContent = "❌ COULDN'T START REMATCH.";
        rematchButton.disabled = false;
        playAgainButton.disabled = false;
    }
}


/* =========================================
   PLAY AGAIN / FIND A DIFFERENT PERSON
========================================= */

async function playAgain() {

    if (!currentMatch) return;

    const previousOpponent = currentMatch.opponent || "";

    playAgainButton.disabled = true;
    rematchButton.disabled = true;

    stopRematchPolling();
    stopGamePolling();

    try {

        const response = await fetch(
            "/api/chess/play-again",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: playerName,
                    avoidOpponent: previousOpponent
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Couldn't start matchmaking.");
        }

        if (result.matched) {
            currentMatch = null;
            onlineGameActive = false;
            hideGameEffect();
            showMatch(result);
            return;
        }

        currentMatch = null;
        onlineGameActive = false;
        hideGameEffect();
        resignButton.style.display = "none";
        joinQueueButton.style.display = "none";
        leaveQueueButton.style.display = "block";
        enterMatchButton.style.display = "block";
        enterMatchButton.disabled = true;
        onlineStatus.textContent = "⚡ FINDING A DIFFERENT CLASSMATE...";
        chessStatus.textContent = "WAITING FOR A NEW OPPONENT...";
        playAgainButton.textContent = "⚡ SEARCHING...";

        startQueuePolling();
        await updateQueueStatus();

    } catch (error) {

        console.error("Play again error:", error);
        playAgainButton.disabled = false;
        rematchButton.disabled = false;
        rematchStatus.textContent = "❌ COULDN'T START SEARCH.";
    }
}


acceptRematchButton.addEventListener(
    "click",
    () => respondToRematch("accept")
);


refuseRematchButton.addEventListener(
    "click",
    () => respondToRematch("refuse")
);


resignButton.addEventListener(
    "click",
    async () => {

        if (
            !currentMatch ||
            !onlineGameActive
        ) {

            return;

        }


        const confirmed =
            confirm(
                "Are you sure you want to resign this game?"
            );


        if (
            !confirmed
        ) {

            return;

        }


        resignButton.disabled =
            true;


        try {

            const response =
                await fetch(

                    "/api/chess/match/" +
                    encodeURIComponent(
                        currentMatch.matchId
                    ) +
                    "/resign",

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    playerName

                            })

                    }

                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Couldn't resign."
                );

            }


            await updateOnlineGame();


        } catch (error) {

            console.error(
                "Resign error:",
                error
            );


            chessStatus.textContent =
                "❌ COULDN'T RESIGN.";


            resignButton.disabled =
                false;

        }

    }
);


restartGame.addEventListener(
    "click",
    () => {

        if (
            onlineGameActive
        ) {

            chessStatus.textContent =
                "ONLINE GAME IS ACTIVE.";

            return;

        }


        game.reset();

        selectedSquare =
            null;


        hideGameEffect();


        renderBoard();

    }
);


joinQueueButton.addEventListener(
    "click",
    joinChessQueue
);


leaveQueueButton.addEventListener(
    "click",
    leaveChessQueue
);

rematchButton.addEventListener(
    "click",
    requestRematch
);


playAgainButton.addEventListener(
    "click",
    playAgain
);


function escapeChessText(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


window.addEventListener(
    "beforeunload",
    () => {

        stopQueuePolling();

        stopGamePolling();


        if (
            !playerName
        ) {

            return;

        }


        if (
            !currentMatch
        ) {

            fetch(
                "/api/chess/queue/leave",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name:
                                playerName

                        }),

                    keepalive:
                        true

                }
            );

        }

    }
);


updateQueueStatus();

renderBoard();

</script>
